name = "meta-matic-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# KV namespace for the tally counters.
# 1) Create it:   npx wrangler kv namespace create TALLY
# 2) Paste the printed id below (replace REPLACE_WITH_KV_ID).
[[kv_namespaces]]
binding = "TALLY"
id = "REPLACE_WITH_KV_ID"
