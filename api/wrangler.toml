name = "meta-matic-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Mount the Worker under a path on the shared api.tor2dbear.com gateway, so the
# host root stays free for other projects (each adds its own /<project>/* route).
# NOTE: unlike a custom_domain, a path route does NOT auto-create DNS. The
# hostname "api.tor2dbear.com" needs a proxied placeholder record first — add a
# proxied AAAA "api" -> 100:: in the tor2dbear.com zone (one-time).
routes = [
  { pattern = "api.tor2dbear.com/meta-matic/*", zone_name = "tor2dbear.com" }
]

# D1 — the certificate ledger. `serial` is the PRIMARY KEY, so exactly one row can
# exist per work: that constraint is what makes "one certificate per work" atomic
# (a second concurrent /claim on the same serial fails the insert instead of racing).
# The database was created out-of-band (dashboard / MCP); its schema lives in
# api/schema.sql. To recreate: npx wrangler d1 create meta-matic-certs, paste the id
# below, then npx wrangler d1 execute meta-matic-certs --file=schema.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "meta-matic-certs"
database_id = "1850438b-4c4f-4b44-931c-a9617078437c"

# R2 — print-ready images, fetched by URL by the print lab (Prodigi).
# Create once: npx wrangler r2 bucket create meta-matic-prints
[[r2_buckets]]
binding = "PRINTS"
bucket_name = "meta-matic-prints"

# Print shop config (v2.1b). SECRETS are NOT here — set them with:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put PRODIGI_API_KEY
[vars]
PRODIGI_BASE = "https://api.sandbox.prodigi.com"  # sandbox first; -> https://api.prodigi.com when live
PRODIGI_SKU = "GLOBAL-CONS-FAP-20X20"              # 20x20" (~51cm) square giclée, Enhanced Matte Art 200gsm, globally routed
PRODIGI_SHIPPING = "Standard"                      # Budget | Standard | StandardPlus | Express | Overnight
PRINT_CURRENCY = "EUR"                             # match your Prodigi account currency to avoid FX
PRICE_PCT_FEE = "0.039"                            # Stripe worst-case %, grossed up so you net full cost
PRICE_FIXED_FEE = "0.30"                           # Stripe fixed fee
PRICE_BUFFER = "1.50"                              # FX/rounding safety margin (never out of pocket)
SITE_ORIGIN = "https://meta-matic.tor2dbear.com"
API_ORIGIN = "https://api.tor2dbear.com/meta-matic"
