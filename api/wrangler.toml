name = "meta-matic-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Mount the Worker under a path on the shared api.tor2dbear.com gateway, so the
# host root stays free for other projects (each adds its own /<project>/* route).
# NOTE: unlike a custom_domain, a path route does NOT auto-create DNS. The
# hostname "api.tor2dbear.com" needs a proxied placeholder record first — add a
# proxied AAAA "api" -> 100:: in the tor2dbear.com zone (one-time). The
# *.workers.dev URL keeps working as a fallback.
routes = [
  { pattern = "api.tor2dbear.com/meta-matic/*", zone_name = "tor2dbear.com" }
]

# KV namespace for the tally counters.
# This id points at the "meta-matic-api-TALLY" namespace already created in the
# account. To recreate from scratch: npx wrangler kv namespace create TALLY
# then paste the printed id below.
[[kv_namespaces]]
binding = "TALLY"
id = "95de505f368c4be5818a78d0d9ff0d08"
